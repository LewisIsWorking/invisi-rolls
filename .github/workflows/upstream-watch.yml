name: Upstream release watch

# Daily: has Foundry, PF2e or SF2e shipped something newer than the last live check? Nothing can run
# a live check from a GitHub runner (it needs the VPS worlds), so this opens one issue to say a check
# is owed and closes itself out when docs/upstream.json is updated.
on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare upstream with the last live check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Read foundryvtt.com and the systems' releases
        id: watch
        run: |
          set +e
          node scripts/check-upstream.ts > upstream.txt 2>&1
          status=$?
          set -e
          cat upstream.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One open issue is enough: a daily comment on an issue nobody has acted on is noise.
      - name: Open an issue when a live check is owed
        if: steps.watch.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh issue list --state open --search 'Live check owed in:title' --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "An issue is already open; not opening another."
            exit 0
          fi
          gh issue create --title 'Live check owed: upstream shipped a new release' --body-file upstream.txt

      - name: Fail when the watch could not read upstream
        if: steps.watch.outputs.status != '0' && steps.watch.outputs.status != '1'
        run: |
          echo "::error::The upstream watch could not read foundryvtt.com or GitHub; see the log above."
          exit 1

      # The baseline moves with the live-check PR, so the next run clears the issue it opened.
      - name: Close the issue once the baseline catches up
        if: steps.watch.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --state open --search 'Live check owed in:title' --json number --jq '.[].number'); do
            gh issue close "$number" --comment 'docs/upstream.json now matches upstream, so the live check is done. Closing.'
          done
